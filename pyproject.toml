[project]
name = "nawday"
version = "0.1.0"
description = "AI-powered structured document to PDF generator"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "passlib[bcrypt]>=1.7.4",
  "pyjwt>=2.8.0",
  "python-multipart>=0.0.9",
  "email-validator>=2.2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]
